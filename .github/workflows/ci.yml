name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test with Firestore emulator
        run: npx firebase-tools@15.25.1 emulators:exec --only firestore --project glaceon-master-set-ci "npm run test"
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
